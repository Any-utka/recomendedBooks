services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # лог запросов хранится на компьютере, а не внутри контейнера — не стирается при пересборке
      - ./backend/logs:/app/logs

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
